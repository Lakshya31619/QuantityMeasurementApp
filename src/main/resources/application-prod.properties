spring.application.name=quantity-measurement-app

server.port=8080

# ── MySQL (prod) ──────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/QuantityMeasurementDb?createDatabaseIfNotExist=true&useSSL=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=lakshya316
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=replace_with_prod_secret_minimum_32_chars
jwt.expiration-ms=86400000

# ── Google OAuth2 ─────────────────────────────────────────────────────────────
google.client-id=YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com

# ── CORS (update to your deployed frontend URL) ───────────────────────────────
cors.allowed-origin=https://your-frontend-domain.com

# ── Logging (minimal in prod) ─────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.app.quantitymeasurement=INFO

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never